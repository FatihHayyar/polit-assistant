services:
  postgres:
    image: postgres:17
    container_name: polit-assistant-db
    environment:
      POSTGRES_DB: polit_assistant
      POSTGRES_USER: polit
      POSTGRES_PASSWORD: polit_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polit -d polit_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: polit-assistant-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  app:
    build: .
    container_name: polit-assistant-app
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/polit_assistant
      SPRING_DATASOURCE_USERNAME: polit
      SPRING_DATASOURCE_PASSWORD: polit_dev_password
      SPRING_PROFILES_ACTIVE: docker

      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"

      MAIL_USERNAME: polit-assistant@localhost
      APP_BASE_URL: http://localhost:8081

      APP_BOOTSTRAP_ENABLED: "true"
      APP_BOOTSTRAP_AFFAIR_LIMIT: "50"

    ports:
      - "8081:8080"

volumes:
  postgres_data: