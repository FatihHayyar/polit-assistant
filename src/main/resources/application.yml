spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000
  application:
    name: polit-assistant

  datasource:
    url: jdbc:postgresql://localhost:5432/polit_assistant
    username: polit
    password: polit_dev_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

  mail:
    from: ${MAIL_USERNAME}

  ollama:
    base-url: http://localhost:11434
    model: qwen2.5:3b

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
openparldata:
  base-url: https://api.openparldata.ch


